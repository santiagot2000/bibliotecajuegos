spring.application.name=bibliotecajuegos

# Configuración de H2
spring.datasource.url=jdbc:h2:mem:bibliotecadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Permite que Hibernate cree las tablas automáticamente basadas en tus @Entity
spring.jpa.hibernate.ddl-auto=update

# Habilita la consola web de H2 para que veas tus tablas en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
